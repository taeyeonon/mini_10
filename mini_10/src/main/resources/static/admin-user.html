<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자 - 회원 관리</title>
    <link rel="stylesheet" href="/assets/css/console.css">
    <style>
        .role-select { padding: 6px 10px; border: 1px solid #d7dce3; border-radius: 8px; background: #fff; font-size: 13px; cursor: pointer; }
        .role-select.is-changed { border-color: #f59e0b; background: #fff7ed; box-shadow: 0 0 0 2px rgba(245,158,11,.18); font-weight: 600; }
        .role-cell-hint { display: block; margin-top: 4px; font-size: 11px; color: #b26a00; font-weight: 600; }
        .save-bar { display: none; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding: 12px 16px; border: 1px solid #fcd9a5; background: #fff7ed; border-radius: 12px; }
        .save-bar.active { display: flex; }
        .save-bar-text { font-size: 14px; color: #92400e; font-weight: 600; }
        .save-bar-actions { display: flex; gap: 8px; }
        .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(15,42,46,.45); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-backdrop.active { display: flex; }
        .modal { background: #fff; border-radius: 16px; max-width: 520px; width: 100%; max-height: 80vh; overflow: auto; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
        .modal-head { padding: 20px 24px 12px; }
        .modal-head h3 { margin: 0; font-size: 18px; }
        .modal-head p { margin: 6px 0 0; font-size: 13px; color: #64756f; }
        .modal-body { padding: 8px 24px; }
        .change-list { list-style: none; margin: 0; padding: 0; }
        .change-list li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eef2f1; font-size: 14px; }
        .change-list li:last-child { border-bottom: none; }
        .change-list .who { flex: 1; }
        .change-list .who .uid { color: #94a3b8; margin-right: 6px; font-size: 12px; }
        .change-arrow { color: #94a3b8; }
        .modal-msg { padding: 0 24px; color: #dc2626; font-size: 13px; min-height: 18px; }
        .modal-foot { padding: 12px 24px 22px; display: flex; justify-content: flex-end; gap: 8px; }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar"></aside>

    <main class="main">
        <div class="page-header">
            <div>
                <h1>회원 관리</h1>
                <div class="today"></div>
            </div>
            <div class="profile">
                <div class="avatar">A</div>
                <div class="profile-text">
                    <div class="role">관리자</div>
                    <div class="email"></div>
                </div>
                <button class="btn-ghost" onclick="jwtLogout()">로그아웃</button>
            </div>
        </div>

        <section class="summary">
            <div class="card">
                <div class="label">전체 사용자</div>
                <div class="value" id="statTotal">-<small>명</small></div>
            </div>
            <div class="card">
                <div class="label">회원 <span class="badge badge-info">CUSTOMER</span></div>
                <div class="value" id="statCustomer">-<small>명</small></div>
            </div>
            <div class="card">
                <div class="label">트레이너 <span class="badge badge-ready">TRAINER</span></div>
                <div class="value" id="statTrainer">-<small>명</small></div>
            </div>
            <div class="card">
                <div class="label">관리자 <span class="badge badge-canceled">ADMIN</span></div>
                <div class="value" id="statAdmin">-<small>명</small></div>
            </div>
        </section>

        <section class="card" style="margin-bottom: 16px;">
            <div class="card-title">🎟️ 수강권 수동 발급</div>
            <div class="card-desc">결제 없이 회원에게 수강권을 직접 지급합니다.</div>
            <div class="card-body">
                <div class="form-grid">
                    <div>
                        <label for="ticketUserId">대상 회원</label>
                        <select id="ticketUserId"><option value="">회원을 불러오는 중...</option></select>
                    </div>
                    <div>
                        <label for="totalCount">총 횟수</label>
                        <input type="number" id="totalCount" min="1" value="10">
                    </div>
                    <div>
                        <label for="startDate">시작일</label>
                        <input type="date" id="startDate">
                    </div>
                    <div>
                        <label for="endDate">종료일</label>
                        <input type="date" id="endDate">
                    </div>
                    <div>
                        <button class="btn-primary" id="issueButton" style="width: 100%;">수강권 발급</button>
                    </div>
                </div>
                <div class="message" id="issueMessage"></div>
            </div>
        </section>

        <section class="card toolbar">
            <input type="text" id="keyword" placeholder="이름 · 이메일 · ID로 검색">
            <select id="role">
                <option value="">전체 역할</option>
                <option value="CUSTOMER">회원 (CUSTOMER)</option>
                <option value="TRAINER">트레이너 (TRAINER)</option>
                <option value="ADMIN">관리자 (ADMIN)</option>
            </select>
            <button class="btn-primary" id="searchButton">검색</button>
            <button class="btn-ghost" id="refreshButton">새로고침</button>
        </section>

        <div class="save-bar" id="saveBar">
            <div class="save-bar-text" id="saveBarText">변경된 역할이 없습니다.</div>
            <div class="save-bar-actions">
                <button class="btn-ghost" id="cancelRolesButton">변경 취소</button>
                <button class="btn-primary" id="saveRolesButton">역할 변경 저장</button>
            </div>
        </div>

        <section class="card table-card">
            <div class="table-scroll">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>이름</th>
                        <th>이메일</th>
                        <th>역할</th>
                    </tr>
                    </thead>
                    <tbody id="tableBody">
                    <tr><td colspan="4" class="empty">불러오는 중...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
            <div class="page-info" id="pageInfo"></div>
            <div class="message error" id="errorMessage"></div>
        </section>
    </main>
</div>

<div class="modal-backdrop" id="roleModal">
    <div class="modal">
        <div class="modal-head">
            <h3>역할 변경 확인</h3>
            <p>아래 <span id="modalCount">0</span>건의 역할을 변경합니다. 저장하시겠어요?</p>
        </div>
        <div class="modal-body">
            <ul class="change-list" id="changeList"></ul>
        </div>
        <div class="modal-msg" id="modalMessage"></div>
        <div class="modal-foot">
            <button class="btn-ghost" id="modalCancel">취소</button>
            <button class="btn-primary" id="modalConfirm">저장</button>
        </div>
    </div>
</div>

<script src="/assets/js/common.js"></script>
<script src="/assets/js/console.js"></script>
<script src="/assets/js/admin.js"></script>
<script>
    // 전체 목록 API 라서 검색·페이징은 클라이언트에서 처리한다.
    // pending: { [userId]: '바꿀 역할' } — 저장 전까지 클라이언트에만 담아 둔다.
    const state = { all: [], page: 0, size: loadAdminSettings().pageSize, pending: {} };

    const ROLE_OPTIONS = [['CUSTOMER', '회원'], ['TRAINER', '트레이너'], ['ADMIN', '관리자']];
    const ROLE_KEYS = ROLE_OPTIONS.map(option => option[0]);

    // 한 회원의 대표 역할(드롭다운 기준값). 회원당 하나의 역할만 사용한다.
    function primaryRole(user) {
        const roles = user.roles || [];
        return roles.find(role => ROLE_KEYS.includes(role)) || roles[0] || 'CUSTOMER';
    }

    function roleLabel(role) {
        return ROLE_BADGE[role]?.label || role;
    }

    function roleSelectHtml(user) {
        const original = primaryRole(user);
        const current = state.pending[user.id] ?? original;
        const changed = current !== original;
        const options = ROLE_OPTIONS.map(([value, label]) =>
            `<option value="${value}"${value === current ? ' selected' : ''}>${label}</option>`).join('');
        const hint = changed
            ? `<span class="role-cell-hint">${escapeHtml(roleLabel(original))} → ${escapeHtml(roleLabel(current))} · 미저장</span>`
            : '';
        return `<select class="role-select${changed ? ' is-changed' : ''}" data-id="${user.id}" data-original="${original}">${options}</select>${hint}`;
    }

    // 저장 전 변경 목록: {id, name, from, to}
    function changedList() {
        return state.all
            .filter(user => state.pending[user.id] !== undefined && state.pending[user.id] !== primaryRole(user))
            .map(user => ({ id: user.id, name: user.name, from: primaryRole(user), to: state.pending[user.id] }));
    }

    function updateSaveBar() {
        const changes = changedList();
        const bar = document.getElementById('saveBar');
        if (changes.length) {
            bar.classList.add('active');
            document.getElementById('saveBarText').textContent = `변경된 역할 ${changes.length}건 · 저장 전`;
        } else {
            bar.classList.remove('active');
        }
    }

    async function loadUsers() {
        const error = document.getElementById('errorMessage');
        error.textContent = '';
        try {
            state.all = await adminRequest('/admin/users');
            state.pending = {};
            renderSummary();
            renderCustomerOptions();
            state.page = 0;
            render();
        } catch (e) {
            document.getElementById('tableBody').innerHTML =
                '<tr><td colspan="4" class="empty">회원 목록을 불러오지 못했습니다.</td></tr>';
            error.textContent = e.message;
        }
    }

    function countByRole(role) {
        return state.all.filter(user => (user.roles || []).includes(role)).length;
    }

    function renderSummary() {
        document.getElementById('statTotal').innerHTML = `${state.all.length.toLocaleString()}<small>명</small>`;
        document.getElementById('statCustomer').innerHTML = `${countByRole('CUSTOMER').toLocaleString()}<small>명</small>`;
        document.getElementById('statTrainer').innerHTML = `${countByRole('TRAINER').toLocaleString()}<small>명</small>`;
        document.getElementById('statAdmin').innerHTML = `${countByRole('ADMIN').toLocaleString()}<small>명</small>`;
    }

    function renderCustomerOptions() {
        const select = document.getElementById('ticketUserId');
        const customers = state.all.filter(user => (user.roles || []).includes('CUSTOMER'));
        select.innerHTML = customers.length
            ? '<option value="">회원 선택</option>' + customers.map(user =>
                `<option value="${user.id}">${escapeHtml(user.name)} (${escapeHtml(user.email)})</option>`).join('')
            : '<option value="">발급 가능한 회원이 없습니다</option>';
    }

    function filtered() {
        const keyword = document.getElementById('keyword').value.trim().toLowerCase();
        const role = document.getElementById('role').value;

        return state.all.filter(user => {
            if (role && !(user.roles || []).includes(role)) return false;
            if (!keyword) return true;
            return String(user.id) === keyword
                || (user.name || '').toLowerCase().includes(keyword)
                || (user.email || '').toLowerCase().includes(keyword);
        });
    }

    function render() {
        const result = slicePage(filtered(), state.page, state.size);
        state.page = result.page;

        const body = document.getElementById('tableBody');
        body.innerHTML = result.content.length
            ? result.content.map(user => `
                <tr>
                    <td class="muted">#${user.id}</td>
                    <td>${escapeHtml(user.name)}</td>
                    <td class="mono">${escapeHtml(user.email)}</td>
                    <td>${roleSelectHtml(user)}</td>
                </tr>`).join('')
            : '<tr><td colspan="4" class="empty">조건에 맞는 회원이 없습니다.</td></tr>';

        renderPagination(document.getElementById('pagination'), result);
        document.getElementById('pageInfo').textContent = result.totalPages
            ? `전체 ${result.totalElements.toLocaleString()}명 · ${result.page + 1} / ${result.totalPages} 페이지`
            : '';
        updateSaveBar();
    }

    // 역할 변경 확인 팝업 열기
    function openRoleModal() {
        const changes = changedList();
        if (!changes.length) return;
        document.getElementById('modalCount').textContent = changes.length;
        document.getElementById('modalMessage').textContent = '';
        document.getElementById('changeList').innerHTML = changes.map(change => `
            <li>
                <span class="who"><span class="uid">#${change.id}</span>${escapeHtml(change.name)}</span>
                ${renderBadge(ROLE_BADGE, change.from)}
                <span class="change-arrow">→</span>
                ${renderBadge(ROLE_BADGE, change.to)}
            </li>`).join('');
        document.getElementById('roleModal').classList.add('active');
    }

    function closeRoleModal() {
        document.getElementById('roleModal').classList.remove('active');
    }

    async function saveRoles() {
        const changes = changedList();
        if (!changes.length) return;
        const confirmButton = document.getElementById('modalConfirm');
        const modalMessage = document.getElementById('modalMessage');
        modalMessage.textContent = '';
        confirmButton.disabled = true;
        try {
            state.all = await adminRequest('/admin/users/roles', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(changes.map(change => ({ id: change.id, role: change.to })))
            });
            state.pending = {};
            closeRoleModal();
            renderSummary();
            renderCustomerOptions();
            render();

            const banner = document.getElementById('errorMessage');
            banner.className = 'message success';
            banner.textContent = `역할 ${changes.length}건을 변경했습니다.`;
            setTimeout(() => { banner.className = 'message error'; banner.textContent = ''; }, 4000);
        } catch (e) {
            modalMessage.textContent = e.message;
        } finally {
            confirmButton.disabled = false;
        }
    }

    async function issueTicket() {
        const message = document.getElementById('issueMessage');
        const button = document.getElementById('issueButton');
        message.className = 'message';
        message.textContent = '';

        const dto = {
            userId: Number(document.getElementById('ticketUserId').value),
            totalCount: Number(document.getElementById('totalCount').value),
            startDate: document.getElementById('startDate').value,
            endDate: document.getElementById('endDate').value
        };
        if (!dto.userId) {
            message.className = 'message error';
            message.textContent = '회원을 선택해 주세요.';
            return;
        }
        if (!dto.totalCount || dto.totalCount < 1) {
            message.className = 'message error';
            message.textContent = '총 횟수는 1회 이상이어야 합니다.';
            return;
        }
        if (!dto.startDate || !dto.endDate || dto.startDate > dto.endDate) {
            message.className = 'message error';
            message.textContent = '사용 기간을 올바르게 입력해 주세요.';
            return;
        }

        button.disabled = true;
        try {
            const result = await adminRequest('/admin/tickets/issue', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dto)
            });
            message.className = 'message success';
            message.textContent = typeof result === 'string' ? result : '수강권을 발급했습니다.';
        } catch (e) {
            message.className = 'message error';
            message.textContent = e.message;
        } finally {
            button.disabled = false;
        }
    }

    function search() {
        state.page = 0;
        render();
    }

    document.addEventListener('DOMContentLoaded', () => {
        if (!initAdminPage('user')) return;

        // 기본 사용 기간: 오늘 ~ 1개월 후
        const today = new Date();
        const nextMonth = new Date();
        nextMonth.setMonth(today.getMonth() + 1);
        document.getElementById('startDate').value = toDateInput(today);
        document.getElementById('endDate').value = toDateInput(nextMonth);

        document.getElementById('issueButton').addEventListener('click', issueTicket);
        document.getElementById('searchButton').addEventListener('click', search);
        document.getElementById('refreshButton').addEventListener('click', loadUsers);
        document.getElementById('role').addEventListener('change', search);

        // 역할 드롭다운 변경(위임): pending 에 담고 다시 렌더링해 미저장 표시.
        document.getElementById('tableBody').addEventListener('change', event => {
            const select = event.target.closest('.role-select');
            if (!select) return;
            const id = Number(select.dataset.id);
            if (select.value === select.dataset.original) {
                delete state.pending[id];
            } else {
                state.pending[id] = select.value;
            }
            render();
        });
        document.getElementById('saveRolesButton').addEventListener('click', openRoleModal);
        document.getElementById('cancelRolesButton').addEventListener('click', () => {
            state.pending = {};
            render();
        });
        document.getElementById('modalConfirm').addEventListener('click', saveRoles);
        document.getElementById('modalCancel').addEventListener('click', closeRoleModal);
        document.getElementById('roleModal').addEventListener('click', event => {
            if (event.target.id === 'roleModal') closeRoleModal();
        });
        document.getElementById('keyword').addEventListener('keydown', event => {
            if (event.key === 'Enter') search();
        });
        document.getElementById('pagination').addEventListener('click', event => {
            const button = event.target.closest('button[data-page]');
            if (button && !button.disabled) {
                state.page = Number(button.dataset.page);
                render();
            }
        });

        loadUsers();
    });
</script>
</body>
</html>
